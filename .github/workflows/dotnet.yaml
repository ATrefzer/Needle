name: .NET Build and Release (Latest)

on:
  # Commenting out automatic triggers
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  # Manually trigger release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The core and the command line tool on Linux. The WPF application cannot be built there.
  cli-linux:
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Core
        run: dotnet test Needle.Core.Tests/Needle.Core.Tests.csproj --configuration Release --verbosity normal

      - name: Publish CLI
        run: dotnet publish Needle.Cli/Needle.Cli.csproj -c Release -r linux-x64 -o publish-cli --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -p:Version=$BUILD_VERSION -p:FileVersion=$BUILD_VERSION -p:AssemblyVersion=$BUILD_VERSION

      # tar keeps the executable flag.
      - name: Pack CLI
        run: tar -czf needle-cli-linux-x64.tar.gz -C publish-cli needle-cli needle-cli.template.json

      - uses: actions/upload-artifact@v4
        with:
          name: needle-cli-linux-x64
          path: needle-cli-linux-x64.tar.gz

  build:
    needs: cli-linux
    runs-on: windows-latest
    env:
      BUILD_VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore
  
      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=$env:BUILD_VERSION -p:FileVersion=$env:BUILD_VERSION -p:AssemblyVersion=$env:BUILD_VERSION -p:PackageVersion=$env:BUILD_VERSION
  
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
  
      - name: Publish
        run: dotnet publish .\Needle\Needle.csproj -c Release -r win-x64 -o publish -p:SelfContained=false -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:SatelliteResourceLanguages=en -p:Version=$env:BUILD_VERSION -p:FileVersion=$env:BUILD_VERSION -p:AssemblyVersion=$env:BUILD_VERSION -p:PackageVersion=$env:BUILD_VERSION
        
      - name: Zip Release
        run: Compress-Archive -Path publish/* -DestinationPath latest-release.zip

      - name: Publish CLI
        run: dotnet publish Needle.Cli/Needle.Cli.csproj -c Release -r win-x64 -o publish-cli -p:SelfContained=false -p:PublishSingleFile=true -p:DebugType=none -p:Version=$env:BUILD_VERSION -p:FileVersion=$env:BUILD_VERSION -p:AssemblyVersion=$env:BUILD_VERSION

      - name: Zip CLI
        run: Compress-Archive -Path publish-cli/* -DestinationPath needle-cli-win-x64.zip

      - uses: actions/download-artifact@v4
        with:
          name: needle-cli-linux-x64

      # Delete existing "latest"-Release & Tag
      - name: Delete existing "latest" release if present
        run: |
          gh release delete latest -y || echo "No existing release"
          git tag -d latest || echo "No local tag"
          git push origin :refs/tags/latest || echo "No remote tag"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create or update Release with fix tag "latest"
      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "v${{ env.BUILD_VERSION }} (Latest)"
          body: |
            Automated build **v${{ env.BUILD_VERSION }}**
            - Build number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}
          draft: false
          prerelease: false
          files: |
            latest-release.zip
            needle-cli-win-x64.zip
            needle-cli-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}